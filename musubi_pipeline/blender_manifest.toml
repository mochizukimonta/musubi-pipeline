schema_version = "1.0.0"

id = "musubi_pipeline"
version = "0.28.0"
name = "Musubi Pipeline"
tagline = "Team production pipeline with P2P-sync integrity verification"
maintainer = "mochizukimonta"
type = "add-on"

# GPL-3.0-or-later は選択ではなく要件。このアドオンは bpy を import する
# Blender の派生著作物であり、extensions.blender.org も GPL-3.0-or-later
# 準拠を求めている。
license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 mochizukimonta"]

website = "https://github.com/mochizukimonta/musubi-pipeline"

blender_version_min = "4.2.0"
tags = ["Pipeline"]

# セキュリティ設計: 外部通信は github.com からの Syncthing 取得(初回のみ・
# SHA-256検証)と 127.0.0.1 のローカルREST APIに限定
[permissions]
files = "プロジェクトフォルダ内のファイル作成・検証(ハッシュ計算)"
network = "Syncthing公式バイナリの取得(初回のみ)とローカル制御API(127.0.0.1)"

# 配布zipから除外するもの。tests/ や docs/ はこのフォルダの外にあるため
# ここに書く必要がない(リポジトリのルート直下に置いてある)。
[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.pyc",
  "*.zip",
]
